name: Build and deploy

# Started manually from the Actions tab. Builds the selected game, or every game
# with "all", plus optionally their APKs and the all-games hub app. On the default
# branch it also:
#   - publishes each built game to its own folder on the gh-pages branch (games
#     that weren't built are left untouched) and regenerates the hub page
#   - publishes each APK (if requested) to the game's "<game>-latest" release
#   - publishes the hub app (if requested) to the "hub-latest" release
run-name: Build ${{ inputs.game }}

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to build
        required: true
        type: choice
        options:
          - all
          # Kept up to date by `npm run new-game`.
          # games:start
          - block-drop
          - hex-hold
          - lantern-maze
          - potion-match
          # games:end
      apk:
        description: Also build the Android APK
        type: boolean
        default: false
      hub_apk:
        description: Also build the all-games hub app (one APK with every game)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.games.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Bakes the leaderboard's address into the games (VITE_LEADERBOARD_URL). Without the
      # Cloudflare secrets the games simply build without a leaderboard.
      - name: Find the leaderboard address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets: building without the leaderboard."
            exit 0
          fi
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
          if [ -z "$sub" ]; then
            echo "::warning::Could not look up the workers.dev subdomain: building without the leaderboard."
            exit 0
          fi
          echo "Leaderboard: https://trial-and-error-leaderboard.$sub.workers.dev"
          echo "VITE_LEADERBOARD_URL=https://trial-and-error-leaderboard.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Work out which games to build
        id: games
        env:
          GAME: ${{ inputs.game }}
        run: |
          if [ "$GAME" = all ]; then
            list=$(ls games/*/game.json | cut -d/ -f2 | jq -Rnc '[inputs]')
          else
            list=$(jq -nc --arg game "$GAME" '[$game]')
          fi
          echo "Building: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GAMES: ${{ steps.games.outputs.list }}
        run: |
          for game in $(jq -r '.[]' <<<"$GAMES"); do
            npm run build -- "$game"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    if: inputs.apk
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One APK per game, built side by side; one failing doesn't stop the others.
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.web.outputs.games) }}
    env:
      GAME: ${{ matrix.game }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - run: npm run android -- "$GAME"

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$GAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: ${{ matrix.game }}.apk

      - name: Publish to "<game>-latest" release
        if: env.IS_DEFAULT_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GAME-latest"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "$GAME.apk" \
            --target "$GITHUB_SHA" \
            --title "$GAME (build #${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download $GAME.apk and open it on your Android device to install."

  # Every game in one app that opens on the hub page. Builds all games itself,
  # whichever game was picked above.
  hub-android:
    if: inputs.hub_apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      # Bakes the leaderboard's address into the games (VITE_LEADERBOARD_URL). Without the
      # Cloudflare secrets the games simply build without a leaderboard.
      - name: Find the leaderboard address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets: building without the leaderboard."
            exit 0
          fi
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
          if [ -z "$sub" ]; then
            echo "::warning::Could not look up the workers.dev subdomain: building without the leaderboard."
            exit 0
          fi
          echo "Leaderboard: https://trial-and-error-leaderboard.$sub.workers.dev"
          echo "VITE_LEADERBOARD_URL=https://trial-and-error-leaderboard.$sub.workers.dev" >> "$GITHUB_ENV"
      - run: npm run android:hub

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/trial-and-error.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trial-and-error-apk
          path: trial-and-error.apk

      - name: Publish to "hub-latest" release
        if: env.IS_DEFAULT_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hub-latest --yes --cleanup-tag || true
          gh release create hub-latest trial-and-error.apk \
            --target "$GITHUB_SHA" \
            --title "All games (build #${{ github.run_number }})" \
            --notes "Every game in one app, built from ${GITHUB_SHA::7}. Download trial-and-error.apk and open it on your Android device to install."

  deploy:
    needs: [web, android, hub-android]
    # Runs when every requested APK succeeded, so the hub never links a missing APK.
    if: >-
      !cancelled() && github.ref_name == github.event.repository.default_branch &&
      needs.web.result == 'success' && needs.android.result != 'failure' &&
      needs.hub-android.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deploys queue up instead of racing on the gh-pages branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add -B gh-pages site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build

      - name: Replace the built games' folders
        env:
          GAMES: ${{ needs.web.outputs.games }}
          APK_BUILT: ${{ needs.android.result == 'success' }}
        run: |
          for game in $(jq -r '.[]' <<<"$GAMES"); do
            previous_apk=$(jq -r '.apk // false' "site/$game/build.json" 2>/dev/null || echo false)
            rm -rf "site/$game"
            cp -r "build/$game" "site/$game"
            apk=false
            if [ "$APK_BUILT" = true ] || [ "$previous_apk" = true ]; then apk=true; fi
            jq -n --arg sha "$GITHUB_SHA" --arg at "$(date -u +%FT%TZ)" --argjson apk "$apk" --argjson run "$GITHUB_RUN_NUMBER" \
              '{sha: $sha, builtAt: $at, apk: $apk, run: $run}' > "site/$game/build.json"
          done
          # Games removed from the repo come off the site too.
          for dir in site/*/; do
            game=$(basename "$dir")
            if [ -f "site/$game/build.json" ] && [ ! -f "games/$game/game.json" ]; then
              echo "Removing $game (no longer in the repo)"
              rm -rf "site/$game"
            fi
          done
          touch site/.nojekyll

      - name: Note the hub app
        if: needs.hub-android.result == 'success'
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg at "$(date -u +%FT%TZ)" \
            '{sha: $sha, builtAt: $at, apk: true}' > site/app.json

      - name: Regenerate hub page
        run: node scripts/build-hub.mjs site

      - name: Push gh-pages
        working-directory: site
        env:
          GAMES: ${{ needs.web.outputs.games }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy $(jq -r 'join(", ")' <<<"$GAMES") (${GITHUB_SHA::7})"
          git push origin gh-pages
